<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FEN Project Store</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:#fff;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(8,8,8,.94);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #242424;
  padding:16px 20px;
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{
  color:#ff2f92;
}

.admin{
  color:#aaa;
  text-decoration:none;
  font-size:14px;
}

.hero{
  max-width:1100px;
  margin:auto;
  padding:70px 20px 40px;
}

.hero h1{
  font-size:clamp(35px,7vw,65px);
  line-height:1;
  margin-bottom:18px;
}

.hero h1 span{
  color:#ff2f92;
}

.hero p{
  color:#999;
  max-width:600px;
  line-height:1.6;
}

.search-box{
  max-width:1100px;
  margin:auto;
  padding:0 20px 20px;
}

.search-box input{
  width:100%;
  padding:16px;
  border-radius:12px;
  border:1px solid #292929;
  background:#111;
  color:white;
  outline:none;
  font-size:16px;
}

.search-box input:focus{
  border-color:#ff2f92;
}

.categories{
  max-width:1100px;
  margin:auto;
  padding:0 20px 25px;
  display:flex;
  gap:9px;
  overflow-x:auto;
}

.category{
  white-space:nowrap;
  border:1px solid #292929;
  background:#111;
  color:#aaa;
  padding:10px 16px;
  border-radius:999px;
  cursor:pointer;
}

.category.active{
  background:#ff2f92;
  color:#fff;
  border-color:#ff2f92;
}

.products{
  max-width:1100px;
  margin:auto;
  padding:10px 20px 50px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

.card{
  background:#111;
  border:1px solid #252525;
  border-radius:17px;
  overflow:hidden;
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
  border-color:#444;
}

.card-image{
  width:100%;
  height:220px;
  object-fit:cover;
  background:#171717;
}

.no-image{
  width:100%;
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#555;
}

.card-content{
  padding:17px;
}

.badge{
  display:inline-block;
  font-size:11px;
  background:#292929;
  color:#bbb;
  padding:5px 9px;
  border-radius:6px;
  margin-bottom:10px;
}

.card h2{
  font-size:19px;
  margin-bottom:9px;
}

.desc{
  color:#888;
  font-size:14px;
  line-height:1.5;
  min-height:42px;
}

.price{
  font-size:22px;
  font-weight:bold;
  margin:17px 0;
}

.buy{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  padding:14px 18px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  background:linear-gradient(135deg,#25D366,#128C7E);
  color:#fff;
  text-align:center;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(18,140,126,.18);
  transition:transform .2s,box-shadow .2s;
}

.buy::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:60%;
  height:100%;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.25),
    transparent
  );
  transform:skewX(-20deg);
  transition:.5s;
}

.buy:hover::before{
  left:130%;
}

.buy:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(18,140,126,.3);
}

.buy:active{
  transform:scale(.97);
}
}

.buy:hover{
  opacity:.9;
}

.loading,
.empty,
.error{
  grid-column:1/-1;
  text-align:center;
  padding:50px 20px;
  color:#888;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.8);
  padding:20px;
  overflow:auto;
}

.modal-box{
  max-width:600px;
  margin:50px auto;
  background:#111;
  border:1px solid #292929;
  border-radius:18px;
  overflow:hidden;
  position:relative;
}

.modal-image{
  width:100%;
  max-height:380px;
  object-fit:cover;
  background:#171717;
}

.modal-content{
  padding:22px;
}

.close{
  position:absolute;
  right:15px;
  top:15px;
  width:38px;
  height:38px;
  border-radius:50%;
  border:0;
  background:#111;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.modal-content h2{
  font-size:25px;
  margin-bottom:12px;
}

.modal-desc{
  color:#999;
  line-height:1.6;
  white-space:pre-line;
  margin-bottom:20px;
}

footer{
  border-top:1px solid #222;
  text-align:center;
  padding:30px 20px;
  color:#666;
}

@media(max-width:600px){

  .hero{
    padding-top:45px;
  }

  .products{
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .card-image,
  .no-image{
    height:160px;
  }

  .card-content{
    padding:12px;
  }

  .card h2{
    font-size:16px;
  }

  .price{
    font-size:18px;
  }

  .desc{
    font-size:12px;
  }

}

@media(max-width:380px){

  .products{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo">
      FEN <span>PROJECT</span>
    </div>

    <a
      class="admin"
      href="admin.html">
      Admin
    </a>

  </div>
</header>


<section class="hero">

  <h1>
    DIGITAL <span>PROJECT</span>
    STORE
  </h1>

  <p>
    Kumpulan project, instrument dan sample pack
    untuk kebutuhan musik kamu.
  </p>

</section>


<div class="search-box">

  <input
    id="search"
    type="search"
    placeholder="🔍 Cari project..."
    oninput="filterProducts()">

</div>


<div
  class="categories"
  id="categories">

  <button
    class="category active"
    onclick="setCategory('Semua',this)">
    Semua
  </button>

</div>


<div
  id="products"
  class="products">

  <div class="loading">
    Memuat produk...
  </div>

</div>


<!-- DETAIL MODAL -->

<div
  id="modal"
  class="modal"
  onclick="closeModal(event)">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal()">
      ×
    </button>

    <img
      id="modalImage"
      class="modal-image">

    <div class="modal-content">

      <div
        id="modalCategory"
        class="badge">
      </div>

      <h2 id="modalName"></h2>

      <div
        id="modalPrice"
        class="price">
      </div>

      <div
        id="modalDescription"
        class="modal-desc">
      </div>

      <a
        id="modalBuy"
        class="buy"
        target="_blank">
        Beli Sekarang via WhatsApp
      </a>

    </div>

  </div>

</div>


<footer>
  © 2026 FEN Project — Digital Project Store
</footer>


<script>

/* ===============================
   SUPABASE
=============================== */

const SUPABASE_URL =
"https://reptktnxppqeltvankgb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_bFObi9r7_j3CRtnF6eIQBQ_vjlbg3FD";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ===============================
   DATA
=============================== */

let allProducts = [];
let currentCategory = "Semua";


/* ===============================
   LOAD PRODUCTS
=============================== */

async function loadProducts(){

  const container =
    document.getElementById("products");

  container.innerHTML =
    `<div class="loading">Memuat produk...</div>`;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("products")
    .select("*")
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    container.innerHTML =
      `<div class="error">
        Gagal memuat produk.<br><br>
        ${error.message}
      </div>`;

    return;
  }


  allProducts =
    data || [];


  createCategories();

  renderProducts(
    allProducts
  );

}


/* ===============================
   CATEGORIES
=============================== */

function createCategories(){

  const box =
    document.getElementById("categories");


  const categories =
    [
      ...new Set(
        allProducts
          .map(p => p.category)
          .filter(Boolean)
      )
    ];


  box.innerHTML = `

    <button
      class="category active"
      onclick="setCategory('Semua',this)">
      Semua
    </button>

  `;


  categories.forEach(category => {

    box.innerHTML += `

      <button
        class="category"
        onclick="setCategory(
          '${escapeAttribute(category)}',
          this
        )">

        ${escapeHTML(category)}

      </button>

    `;

  });

}


/* ===============================
   CATEGORY FILTER
=============================== */

function setCategory(
  category,
  button
){

  currentCategory =
    category;


  document
    .querySelectorAll(".category")
    .forEach(btn => {

      btn.classList.remove(
        "active"
      );

    });


  button.classList.add(
    "active"
  );


  filterProducts();

}


/* ===============================
   SEARCH
=============================== */

function filterProducts(){

  const keyword =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    allProducts.filter(product => {

      const matchCategory =
        currentCategory === "Semua" ||
        product.category ===
        currentCategory;


      const text =
        (
          product.name +
          " " +
          (product.description || "")
        ).toLowerCase();


      const matchSearch =
        text.includes(keyword);


      return (
        matchCategory &&
        matchSearch
      );

    });


  renderProducts(
    filtered
  );

}


/* ===============================
   RENDER
=============================== */

function renderProducts(
  products
){

  const container =
    document.getElementById("products");


  if(!products.length){

    container.innerHTML =
      `<div class="empty">
        Produk tidak ditemukan.
      </div>`;

    return;

  }


  container.innerHTML =
    products.map(product => {

      const image =
        product.image
        ?
        `<img
          class="card-image"
          src="${escapeAttribute(product.image)}"
          alt="${escapeAttribute(product.name)}"
          loading="lazy">`
        :
        `<div class="no-image">
          No Image
        </div>`;


      return `

        <article
          class="card"
          onclick="openProduct('${product.id}')">

          ${image}

          <div class="card-content">

            <div class="badge">
              ${escapeHTML(
                product.category ||
                "Project"
              )}
            </div>

            <h2>
              ${escapeHTML(
                product.name
              )}
            </h2>

            <div class="desc">
              ${escapeHTML(
                product.description ||
                ""
              )}
            </div>

            <div class="price">
              Rp ${Number(
                product.price || 0
              ).toLocaleString("id-ID")}
            </div>

            <button
              class="buy"
              onclick="
                event.stopPropagation();
                buyProduct('${product.id}')
              ">

              Beli Sekarang

            </button>

          </div>

        </article>

      `;

    }).join("");

}


/* ===============================
   OPEN DETAIL
=============================== */

function openProduct(id){

  const product =
    allProducts.find(
      p => p.id === id
    );


  if(!product) return;


  document.getElementById(
    "modalName"
  ).innerText =
    product.name;


  document.getElementById(
    "modalPrice"
  ).innerText =
    "Rp " +
    Number(
      product.price || 0
    ).toLocaleString("id-ID");


  document.getElementById(
    "modalCategory"
  ).innerText =
    product.category ||
    "Project";


  document.getElementById(
    "modalDescription"
  ).innerText =
    product.description ||
    "Tidak ada deskripsi.";


  const image =
    document.getElementById(
      "modalImage"
    );


  if(product.image){

    image.src =
      product.image;

    image.style.display =
      "block";

  }else{

    image.style.display =
      "none";

  }


  setWhatsAppLink(
    product
  );


  document.getElementById(
    "modal"
  ).style.display =
    "block";


  document.body.style.overflow =
    "hidden";

}


/* ===============================
   WHATSAPP
=============================== */

function setWhatsAppLink(
  product
){

  let phone =
    product.whatsapp ||
    "6285646470358";


  phone =
    phone
      .replace(/\D/g,"");


  const message =
    `Halo, saya mau membeli ${product.name}

Harga: Rp ${Number(
  product.price || 0
).toLocaleString("id-ID")}

Mohon informasi cara pembayarannya. Terima kasih.`;


  const url =
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(
      message
    );


  document.getElementById(
    "modalBuy"
  ).href =
    url;

}


/* ===============================
   BUY DIRECT
=============================== */

function buyProduct(id){

  const product =
    allProducts.find(
      p => p.id === id
    );


  if(!product) return;


  let phone =
    product.whatsapp ||
    "6285646470358";


  phone =
    phone
      .replace(/\D/g,"");


  const message =
    `Halo, saya mau membeli ${product.name}

Harga: Rp ${Number(
  product.price || 0
).toLocaleString("id-ID")}

Mohon informasi cara pembayarannya. Terima kasih.`;


  window.open(
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(
      message
    ),
    "_blank"
  );

}


/* ===============================
   CLOSE MODAL
=============================== */

function closeModal(event){

  if(
    event &&
    event.target !==
    document.getElementById("modal")
  ){

    return;

  }


  document.getElementById(
    "modal"
  ).style.display =
    "none";


  document.body.style.overflow =
    "";

}


/* ===============================
   SECURITY HELPERS
=============================== */

function escapeHTML(text){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;

}


function escapeAttribute(text){

  return String(
    text || ""
  )
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* ===============================
   START
=============================== */

loadProducts();

</script>

</body>
</html>
