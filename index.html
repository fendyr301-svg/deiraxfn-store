<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FEN Project Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #222;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      color: #999;
      margin-top: 8px;
    }

    .hero {
      padding: 55px 20px;
      text-align: center;
      background: linear-gradient(135deg, #111, #050505);
    }

    .hero h2 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #aaa;
    }

    .products {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 22px;
    }

    .card {
      background: #111;
      border: 1px solid #242424;
      border-radius: 18px;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #181818;
    }

    .no-image {
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
    }

    .content {
      padding: 20px;
    }

    .content h3 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .description {
      color: #999;
      line-height: 1.5;
      min-height: 45px;
    }

    .price {
      font-size: 23px;
      font-weight: bold;
      margin: 18px 0;
    }

    .buy {
      display: block;
      width: 100%;
      padding: 13px;
      text-align: center;
      background: #16a34a;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .buy:hover {
      background: #15803d;
    }

    .loading,
    .error {
      text-align: center;
      padding: 50px 20px;
      color: #aaa;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #666;
      border-top: 1px solid #222;
    }
  </style>
</head>

<body>

<header>
  <h1>DeiraxFn Store</h1>
  <p>Digital Instrument & Project Store</p>
</header>

<section class="hero">
  <h2>Premium Digital Project</h2>
  <p>Temukan project dan instrument terbaik untuk musik kamu.</p>
</section>

<div id="products" class="products">
  <div class="loading">
    Memuat produk...
  </div>
</div>

<footer>
  © 2026 FEN Project
</footer>

<script>

  // =========================
  // SUPABASE
  // =========================

  const SUPABASE_URL =
    "https://reptktnxppqeltvankgb.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_bFObi9r7_j3CRtnF6eIQBQ_vjlbg3FD";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =========================
  // LOAD PRODUCTS
  // =========================

  async function loadProducts() {

    const container =
      document.getElementById("products");

    const { data, error } =
      await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    if (error) {

      console.error(error);

      container.innerHTML = `
        <div class="error">
          Gagal mengambil produk.<br>
          ${error.message}
        </div>
      `;

      return;
    }

    if (!data || data.length === 0) {

      container.innerHTML = `
        <div class="loading">
          Belum ada produk.
        </div>
      `;

      return;
    }

    container.innerHTML = "";

    data.forEach(product => {

      let imageHTML = "";

      if (product.image) {

        imageHTML = `
          <img
            src="${product.image}"
            alt="${product.name}"
          >
        `;

      } else {

        imageHTML = `
          <div class="no-image">
            Tidak ada gambar
          </div>
        `;

      }

      const phone =
        product.whatsapp || "6285646470358";

      const message =
        encodeURIComponent(
          `Halo, saya mau membeli ${product.name}`
        );

      container.innerHTML += `

        <div class="card">

          ${imageHTML}

          <div class="content">

            <h3>
              ${product.name}
            </h3>

            <div class="description">
              ${product.description || ""}
            </div>

            <div class="price">
              Rp ${Number(product.price)
                .toLocaleString("id-ID")}
            </div>

            <a
              class="buy"
              href="https://wa.me/${phone}?text=${message}"
              target="_blank"
            >
              Beli Sekarang
            </a>

          </div>

        </div>

      `;

    });

  }

  loadProducts();

</script>

</body>
</html>
