<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - FEN Project Store</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#08090d;
  color:white;
}

header{
  background:#101218;
  border-bottom:1px solid #252832;
  padding:18px 20px;
  position:sticky;
  top:0;
  z-index:20;
}

.nav{
  max-width:1000px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{
  color:#ff2f92;
}

.logout{
  background:#292e39;
  color:white;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:25px 18px;
}

.panel{
  background:#11141c;
  border:1px solid #252832;
  border-radius:18px;
  padding:25px;
  margin-bottom:25px;
}

h1{
  margin-bottom:8px;
}

h2{
  margin-bottom:18px;
}

.subtitle{
  color:#8f95a3;
  line-height:1.5;
  margin-bottom:20px;
}

label{
  display:block;
  margin:17px 0 7px;
  color:#d5d8df;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  background:#090b10;
  border:1px solid #30343e;
  color:white;
  border-radius:9px;
  outline:none;
  font-size:15px;
}

select{
  cursor:pointer;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#ff2f92;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.preview{
  width:100%;
  max-height:300px;
  object-fit:contain;
  background:#090b10;
  border-radius:12px;
  margin-top:12px;
  display:none;
}

.main-btn{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:0;
  border-radius:10px;
  background:#ff2f92;
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.main-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.cancel-btn{
  width:100%;
  padding:13px;
  margin-top:9px;
  border:0;
  border-radius:10px;
  background:#292e39;
  color:white;
  cursor:pointer;
}

.status{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  background:#191c24;
  color:#ddd;
  line-height:1.5;
}

.products{
  display:grid;
  gap:12px;
}

.product{
  background:#11141c;
  border:1px solid #252832;
  border-radius:14px;
  padding:14px;
  display:flex;
  gap:15px;
  align-items:center;
}

.product-image{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:10px;
  background:#090b10;
  flex-shrink:0;
}

.product-info{
  flex:1;
  min-width:0;
}

.product-name{
  font-size:17px;
  font-weight:bold;
  margin-bottom:7px;
  word-break:break-word;
}

.product-category{
  display:inline-block;
  background:#292e39;
  color:#bbb;
  padding:5px 8px;
  border-radius:6px;
  font-size:11px;
  margin-bottom:7px;
}

.product-price{
  color:#ff2f92;
  font-weight:bold;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}

.edit-btn{
  border:0;
  background:#292e39;
  color:white;
  padding:8px 13px;
  border-radius:7px;
  cursor:pointer;
}

.delete-btn{
  border:0;
  background:#c62828;
  color:white;
  padding:8px 13px;
  border-radius:7px;
  cursor:pointer;
}

.login-box{
  max-width:500px;
  margin:60px auto;
}

.hidden{
  display:none !important;
}

.empty{
  text-align:center;
  padding:40px;
  color:#777;
  background:#11141c;
  border:1px solid #252832;
  border-radius:14px;
}

@media(max-width:600px){

  .product{
    align-items:flex-start;
  }

  .product-image{
    width:75px;
    height:75px;
  }

  .product-name{
    font-size:15px;
  }

}
</style>
</head>

<body>

<header>

  <div class="nav">

    <div class="logo">
      FEN <span>PROJECT</span>
    </div>

    <button
      id="logoutBtn"
      class="logout hidden"
      onclick="logout()">
      Logout
    </button>

  </div>

</header>


<!-- =========================
     LOGIN
========================= -->

<section
  id="loginSection"
  class="container">

  <div class="panel login-box">

    <h1>Admin Login</h1>

    <p class="subtitle">
      Login untuk mengelola produk FEN Project Store.
    </p>

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Email admin">


    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Password">


    <button
      class="main-btn"
      onclick="login()">

      LOGIN

    </button>


    <div
      id="loginStatus"
      class="status">
    </div>

  </div>

</section>


<!-- =========================
     ADMIN
========================= -->

<section
  id="adminSection"
  class="container hidden">


  <!-- FORM -->

  <div class="panel">

    <h1 id="formTitle">
      Tambah Produk
    </h1>

    <p class="subtitle">
      Produk yang disimpan di sini akan otomatis
      muncul di website toko.
    </p>


    <label>Nama Produk</label>

    <input
      type="text"
      id="name"
      placeholder="Contoh: Pepujaning Ati FLM!! Fullpack Sample">


    <label>Kategori</label>

    <select id="category">

      <option value="Project">
        🎵 Project
      </option>

      <option value="Instrument">
        🎹 Instrument
      </option>

      <option value="Sample Pack">
        🎧 Sample Pack
      </option>

      <option value="Preset">
        🔥 Preset
      </option>

      <option value="Fullpack">
        📦 Fullpack
      </option>

    </select>


    <label>Harga</label>

    <input
      type="number"
      id="price"
      placeholder="20000"
      min="0">


    <label>Deskripsi</label>

    <textarea
      id="description"
      placeholder="Tuliskan deskripsi produk..."></textarea>


    <label>Nomor WhatsApp</label>

    <input
      type="text"
      id="whatsapp"
      value="6285646470358"
      placeholder="628xxxxxxxxxx">


    <label>Foto Produk</label>

    <input
      type="file"
      id="imageFile"
      accept="image/*"
      onchange="previewImage()">


    <img
      id="imagePreview"
      class="preview">


    <button
      id="saveBtn"
      class="main-btn"
      onclick="saveProduct()">

      SIMPAN PRODUK

    </button>


    <button
      id="cancelBtn"
      class="cancel-btn hidden"
      onclick="cancelEdit()">

      BATAL EDIT

    </button>


    <div
      id="saveStatus"
      class="status">
    </div>

  </div>


  <!-- PRODUCTS -->

  <div>

    <h2>
      📦 Produk Saya
    </h2>

    <div
      id="productList"
      class="products">

      Memuat produk...

    </div>

  </div>

</section>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://reptktnxppqeltvankgb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_bFObi9r7_j3CRtnF6eIQBQ_vjlbg3FD";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   VARIABLE
========================================= */

let editingId = null;
let oldImagePath = null;


/* =========================================
   LOGIN
========================================= */

async function login(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const status =
    document.getElementById(
      "loginStatus"
    );


  if(!email || !password){

    showStatus(
      status,
      "Email dan password wajib diisi."
    );

    return;

  }


  showStatus(
    status,
    "Sedang login..."
  );


  const {
    data,
    error
  } =
  await supabaseClient.auth
    .signInWithPassword({

      email:email,

      password:password

    });


  if(error){

    showStatus(
      status,
      "Login gagal: " +
      error.message
    );

    return;

  }


  showAdmin();

}


/* =========================================
   SHOW ADMIN
========================================= */

function showAdmin(){

  document
    .getElementById(
      "loginSection"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "adminSection"
    )
    .classList
    .remove("hidden");


  document
    .getElementById(
      "logoutBtn"
    )
    .classList
    .remove("hidden");


  loadProducts();

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();

}


/* =========================================
   CHECK USER
========================================= */

async function checkUser(){

  const {
    data:{
      user
    }
  } =
  await supabaseClient.auth
    .getUser();


  if(user){

    showAdmin();

  }

}

checkUser();


/* =========================================
   PREVIEW IMAGE
========================================= */

function previewImage(){

  const file =
    document
      .getElementById(
        "imageFile"
      )
      .files[0];

  const preview =
    document.getElementById(
      "imagePreview"
    );


  if(!file){

    preview.style.display =
      "none";

    return;

  }


  preview.src =
    URL.createObjectURL(file);

  preview.style.display =
    "block";

}


/* =========================================
   UPLOAD IMAGE
========================================= */

async function uploadImage(file){

  if(!file){

    return null;

  }


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const fileName =
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2) +
    "." +
    extension;


  const {
    error
  } =
  await supabaseClient
    .storage
    .from("product-images")
    .upload(
      fileName,
      file,
      {
        cacheControl:"3600",
        upsert:false
      }
    );


  if(error){

    throw error;

  }


  const {
    data
  } =
  supabaseClient
    .storage
    .from("product-images")
    .getPublicUrl(
      fileName
    );


  return {
    url:data.publicUrl,
    path:fileName
  };

}


/* =========================================
   SAVE PRODUCT
========================================= */

async function saveProduct(){

  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const category =
    document
      .getElementById("category")
      .value;


  const price =
    document
      .getElementById("price")
      .value;


  const description =
    document
      .getElementById("description")
      .value
      .trim();


  const whatsapp =
    document
      .getElementById("whatsapp")
      .value
      .trim();


  const file =
    document
      .getElementById("imageFile")
      .files[0];


  const status =
    document.getElementById(
      "saveStatus"
    );


  const button =
    document.getElementById(
      "saveBtn"
    );


  if(!name){

    showStatus(
      status,
      "Nama produk wajib diisi."
    );

    return;

  }


  if(!price){

    showStatus(
      status,
      "Harga produk wajib diisi."
    );

    return;

  }


  button.disabled =
    true;

  button.innerText =
    "MENYIMPAN...";


  try{

    let imageUrl = null;
    let imagePath = null;


    /* =====================
       UPLOAD GAMBAR
    ===================== */

    if(file){

      const uploaded =
        await uploadImage(
          file
        );

      imageUrl =
        uploaded.url;

      imagePath =
        uploaded.path;

    }


    /* =====================
       EDIT
    ===================== */

    if(editingId){

      const updateData = {

        name:name,

        category:category,

        price:Number(price),

        description:description,

        whatsapp:whatsapp

      };


      if(imageUrl){

        updateData.image =
          imageUrl;

      }


      const {
        error
      } =
      await supabaseClient
        .from("products")
        .update(
          updateData
        )
        .eq(
          "id",
          editingId
        );


      if(error){

        throw error;

      }


      /* DELETE OLD IMAGE */

      if(
        imageUrl &&
        oldImagePath
      ){

        await supabaseClient
          .storage
          .from(
            "product-images"
          )
          .remove([
            oldImagePath
          ]);

      }


      showStatus(
        status,
        "Produk berhasil diperbarui! ✅"
      );

    }


    /* =====================
       TAMBAH PRODUK
    ===================== */

    else{

      const {
        error
      } =
      await supabaseClient
        .from("products")
        .insert({

          name:name,

          category:category,

          price:Number(price),

          description:description,

          image:imageUrl,

          whatsapp:
            whatsapp ||
            "6285646470358"

        });


      if(error){

        throw error;

      }


      showStatus(
        status,
        "Produk berhasil ditambahkan! ✅"
      );

    }


    resetForm();

    loadProducts();

  }
  catch(error){

    console.error(error);

    showStatus(
      status,
      "Gagal: " +
      error.message
    );

  }


  button.disabled =
    false;

  button.innerText =
    "SIMPAN PRODUK";

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

  const list =
    document.getElementById(
      "productList"
    );


  list.innerHTML =
    "Memuat produk...";


  const {
    data,
    error
  } =
  await supabaseClient
    .from("products")
    .select("*")
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    list.innerHTML =
      `<div class="empty">
        ${escapeHTML(
          error.message
        )}
      </div>`;

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    list.innerHTML =
      `<div class="empty">
        Belum ada produk.
      </div>`;

    return;

  }


  list.innerHTML = "";


  data.forEach(
    product => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "product";


      const image =
        product.image
        ?
        `<img
          class="product-image"
          src="${escapeAttribute(
            product.image
          )}"
          alt="${escapeAttribute(
            product.name
          )}">`
        :
        `<div
          class="product-image"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            color:#555;
          ">
          No Image
        </div>`;


      div.innerHTML = `

        ${image}

        <div class="product-info">

          <div class="product-category">
            ${escapeHTML(
              product.category ||
              "Project"
            )}
          </div>

          <div class="product-name">
            ${escapeHTML(
              product.name
            )}
          </div>

          <div class="product-price">
            Rp ${Number(
              product.price || 0
            ).toLocaleString(
              "id-ID"
            )}
          </div>

          <div class="actions">

            <button
              class="edit-btn"
              onclick="editProduct('${escapeAttribute(
                product.id
              )}')">

              ✏️ Edit

            </button>

            <button
              class="delete-btn"
              onclick="deleteProduct('${escapeAttribute(
                product.id
              )}')">

              🗑️ Hapus

            </button>

          </div>

        </div>

      `;


      list.appendChild(
        div
      );

    }
  );

}


/* =========================================
   EDIT PRODUCT
========================================= */

async function editProduct(id){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("products")
    .select("*")
    .eq(
      "id",
      id
    )
    .single();


  if(error){

    alert(
      error.message
    );

    return;

  }


  editingId =
    data.id;


  document
    .getElementById(
      "name"
    )
    .value =
    data.name || "";


  document
    .getElementById(
      "category"
    )
    .value =
    data.category ||
    "Project";


  document
    .getElementById(
      "price"
    )
    .value =
    data.price || "";


  document
    .getElementById(
      "description"
    )
    .value =
    data.description || "";


  document
    .getElementById(
      "whatsapp"
    )
    .value =
    data.whatsapp ||
    "6285646470358";


  document
    .getElementById(
      "formTitle"
    )
    .innerText =
    "Edit Produk";


  document
    .getElementById(
      "saveBtn"
    )
    .innerText =
    "UPDATE PRODUK";


  document
    .getElementById(
      "cancelBtn"
    )
    .classList
    .remove(
      "hidden"
    );


  oldImagePath =
    getStoragePath(
      data.image
    );


  if(data.image){

    const preview =
      document.getElementById(
        "imagePreview"
      );

    preview.src =
      data.image;

    preview.style.display =
      "block";

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================
   DELETE PRODUCT
========================================= */

async function deleteProduct(id){

  const yes =
    confirm(
      "Yakin ingin menghapus produk ini?"
    );


  if(!yes){

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("products")
    .select("image")
    .eq(
      "id",
      id
    )
    .single();


  if(error){

    alert(
      error.message
    );

    return;

  }


  const {
    error:deleteError
  } =
  await supabaseClient
    .from("products")
    .delete()
    .eq(
      "id",
      id
    );


  if(deleteError){

    alert(
      deleteError.message
    );

    return;

  }


  const imagePath =
    getStoragePath(
      data.image
    );


  if(imagePath){

    await supabaseClient
      .storage
      .from(
        "product-images"
      )
      .remove([
        imagePath
      ]);

  }


  loadProducts();

}


/* =========================================
   GET STORAGE PATH
========================================= */

function getStoragePath(url){

  if(!url){

    return null;

  }


  const marker =
    "/product-images/";


  const index =
    url.indexOf(
      marker
    );


  if(index === -1){

    return null;

  }


  return decodeURIComponent(
    url.substring(
      index +
      marker.length
    )
  );

}


/* =========================================
   RESET FORM
========================================= */

function resetForm(){

  editingId =
    null;

  oldImagePath =
    null;


  document
    .getElementById(
      "name"
    )
    .value = "";


  document
    .getElementById(
      "category"
    )
    .value =
    "Project";


  document
    .getElementById(
      "price"
    )
    .value = "";


  document
    .getElementById(
      "description"
    )
    .value = "";


  document
    .getElementById(
      "whatsapp"
    )
    .value =
    "6285646470358";


  document
    .getElementById(
      "imageFile"
    )
    .value = "";


  document
    .getElementById(
      "imagePreview"
    )
    .style
    .display =
    "none";


  document
    .getElementById(
      "formTitle"
    )
    .innerText =
    "Tambah Produk";


  document
    .getElementById(
      "saveBtn"
    )
    .innerText =
    "SIMPAN PRODUK";


  document
    .getElementById(
      "cancelBtn"
    )
    .classList
    .add(
      "hidden"
    );

}


/* =========================================
   CANCEL EDIT
========================================= */

function cancelEdit(){

  resetForm();

}


/* =========================================
   STATUS
========================================= */

function showStatus(
  element,
  text
){

  element.innerText =
    text;

  element.style.display =
    "block";

}


/* =========================================
   ESCAPE
========================================= */

function escapeHTML(text){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;

}


function escapeAttribute(text){

  return String(
    text || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );

}

</script>

</body>
</html>
